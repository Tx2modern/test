name: Refresh Dashboard Data

on:
  schedule:
    # 23:00 UTC, weekdays only — matches nb_yahoo_ingest's Fabric schedule
    # (17:00 America/New_York, Mon-Fri), with a buffer past the DST-shifted
    # completion time (21:00 UTC in EDT, 22:00 UTC in EST).
    - cron: "0 23 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Fabric client libraries (only if secrets are configured)
        env:
          FABRIC_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
        run: |
          if [ -z "$FABRIC_CLIENT_SECRET" ]; then
            echo "FABRIC_CLIENT_SECRET not set — skipping ODBC driver setup (mock mode)."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y unixodbc unixodbc-dev
          curl -sSL -O https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          ACCEPT_EULA=Y sudo apt-get install -y msodbcsql18
          pip install -r requirements.txt

      - name: Export Lakehouse data (falls back to mock data automatically)
        env:
          FABRIC_SQL_ENDPOINT: ${{ secrets.FABRIC_SQL_ENDPOINT }}
          FABRIC_DATABASE: ${{ secrets.FABRIC_DATABASE }}
          FABRIC_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}
          FABRIC_CLIENT_ID: ${{ secrets.FABRIC_CLIENT_ID }}
          FABRIC_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
        run: python3 scripts/export_lakehouse_data.py

      - name: Stage site (exclude repo internals from the published output)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          cp -r data _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
